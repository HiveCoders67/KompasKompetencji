<!DOCTYPE html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1280" />
    <title>Kompas Kompetencji</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <script>
      // apply the remembered manual theme before first paint (STYLE_GUIDE § 1)
      try { const t = localStorage.getItem('kompas-theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
